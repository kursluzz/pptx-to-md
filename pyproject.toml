[project]
name = "pptx-to-md"
version = "0.1.0"
description = "Convert PowerPoint (.pptx) presentations to clean Markdown, with optional LLM-powered image and slide descriptions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleg", email = "kursluzz@gmail.com" }]
requires-python = ">=3.11"
keywords = ["pptx", "powerpoint", "markdown", "converter", "llm", "bedrock", "openai", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
openai = ["openai>=1.40"]
all = ["boto3>=1.34", "openai>=1.40"]

[project.urls]
Homepage = "https://github.com/kursluzz/pptx-to-md"
Issues = "https://github.com/kursluzz/pptx-to-md/issues"
Changelog = "https://github.com/kursluzz/pptx-to-md/blob/main/CHANGELOG.md"

[project.scripts]
pptx-to-md = "pptx_to_md.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.34",
    "openai>=1.40",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`
